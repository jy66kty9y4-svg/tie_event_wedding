const tabs=[['overview','Обзор'],['tasks','План'],['approvals','Согласования'],['vendors','Подрядчики'],['finance','Финансы'],['guests','Гости'],['seating','Рассадка'],['day','День свадьбы'],['more','Ещё']];

const kpi=(label,value,detail='')=>`<div class="kpi"><div class="label">${label}</div><strong>${value}</strong><div class="detail">${detail}</div></div>`;
function checks(){return `<section class="card"><div class="check-header"><span style="color:var(--amber)">△</span>Проверка перед свадьбой<small>2 требуют внимания<br>проверено сегодня</small></div>
${[['warn','!','Бронь фотографа не подтверждена','Добавьте подтверждение договорённости по выбранной услуге.','Подрядчики'],['warn','!','Две задачи просрочены','Утвердить меню и согласовать время приезда декоратора.','План'],['unknown','?','Ожидаем ответы от 4 гостей','Срок ответа — 12 сентября. До него это не просрочка.','Гости'],['ok','✓','Договор отмечен организатором','',''],['ok','✓','Просроченных выплат подрядчикам нет','',''],['ok','✓','Программа дня: обязательные поля заполнены','',''],['unknown','?','Рассажены 30 из 32 подтвердивших гостей','Двум гостям нужно выбрать места.','Рассадка']].map(([type,icon,title,note,action])=>`<div class="check-row"><span class="status-icon ${type==='warn'?'warn':type==='unknown'?'unknown':''}">${icon}</span><div class="check-content"><strong>${title}</strong>${note?`<p>${note}</p>`:''}</div>${action?`<div class="check-actions"><button class="link-btn" data-page="${action==='План'?'tasks':action==='Рассадка'?'seating':action==='Гости'?'guests':'vendors'}">Открыть</button><button class="snooze" aria-label="Напомнить позже" data-demo="В продукте здесь выбирается срок личного напоминания. Проверка не становится успешной.">◷</button></div>`:''}</div>`).join('')}</section>`}
function today(){return `<div class="page-heading"><div><h1>Здравствуйте, Мария!</h1><p class="sub">Вторник, 8 сентября · всё важное на ближайшие дни</p></div></div><div class="kpis">${kpi('Активных свадеб','3','в подготовке')}${kpi('Заявок на рассмотрении','5','открыть входящие')}${kpi('Задач просрочено','4','в двух проектах')}${kpi('Ближайшая свадьба','19 сентября','Алина и Даниил · через 11 дней')}</div><div class="split"><section class="card pad"><div class="card-head"><h2>ⓘ Требует внимания</h2><span class="badge amber">6 действий</span></div><div class="group-label">Подготовка и решения</div><div class="item"><span class="dot">△</span><div class="text"><strong>Утвердить меню банкета</strong><small>Алина и Даниил · срок был 6 сентября</small></div><button class="link-btn" data-page="tasks">Открыть →</button></div><div class="item"><span class="dot">△</span><div class="text"><strong>Получить подтверждение фотографа</strong><small>Алина и Даниил · выбран, бронь ещё не отмечена</small></div><button class="link-btn" data-page="overview">Открыть →</button></div><div class="item"><span class="dot">○</span><div class="text"><strong>Согласовать оформление церемонии</strong><small>Отправлено паре · решение до 10 сентября</small></div><button class="link-btn" data-page="approvals">Варианты →</button></div><div class="group-label">Ближайшие выплаты</div><div class="item"><span class="date">10 сен.</span><div class="text"><strong>Остаток за декор</strong><small>Алина и Даниил</small></div><strong>45 000 ₽</strong></div><button class="link-btn" data-page="overview" style="margin-top:12px">Все проверки свадьбы →</button></section><section class="card pad" style="align-self:start"><div class="card-head"><h2>▦ Ближайшие 7 дней</h2></div><div class="item"><span class="date">09 сен.<br>15:00</span><div class="text"><strong>Встреча на площадке</strong><small>Алина и Даниил</small></div></div><div class="item"><span class="date">10 сен.<br>12:00</span><div class="text"><strong>Обсуждение концепции</strong><small>Вера и Никита</small></div></div><div class="item"><span class="date">12 сен.</span><div class="text"><strong>Ответы гостей</strong><small>Завершается срок RSVP</small></div></div><button class="link-btn" data-page="calendar" style="margin-top:15px">Весь календарь →</button></section></div><section class="soft-card"><h3>♡ Форма заявки</h3><p class="sub">Отправьте ссылку паре — заявление попадёт в существующий процесс рассмотрения.</p><div class="copy-field">https://ваш-домен/заявка <span class="muted">· пример адреса</span></div><div class="row"><button class="btn" data-demo="В рабочей версии копируется настроенная ссылка формы. Этот адрес — пример.">▢ Скопировать ссылку</button><button class="btn secondary" data-demo="В рабочей версии открывается существующая форма заявки.">Открыть ↗</button></div></section>`}
function overview(){return projectHead('overview')+`<div class="kpis">${kpi('Выполнено задач','8 из 18','открыть план подготовки')}${kpi('Нужно согласовать','2 решения','ближайшее — 10 сентября')}${kpi('Гости подтвердили','32 из 36','4 ожидают ответа')}${kpi('Осталось выплатить','125 000 ₽','из согласованных 620 000 ₽')}</div><div class="split" style="margin-bottom:22px"><section class="card pad"><div class="card-head"><h2>Ваш следующий шаг</h2><span class="badge">Для пары</span></div><h2>Выбрать оформление церемонии</h2><p class="sub">Три варианта с фотографиями, составом и стоимостью. Решение останется в истории подготовки.</p><button class="btn" data-page="approvals" style="margin-top:16px">Посмотреть варианты →</button></section><section class="card pad"><div class="card-head"><h2>Ближайшее событие</h2></div><p class="eyebrow">9 сентября · 15:00</p><h3>Встреча на площадке</h3><p class="sub">Мария, Алина и Даниил<br>Усадьба «Липы»</p><button class="link-btn" data-page="calendar">Открыть календарь →</button></section></div>${checks()}`}
function tasks(){const rows=[['Утвердить меню банкета','Последние детали','6 сентября','Алина','В работе','amber'],['Выбрать оформление церемонии','Связано с согласованием','10 сентября','Пара','В работе',''],['Собрать ответы гостей','За 7 дней до свадьбы','12 сентября','Даниил','Запланировано','gray'],['Проверить рассадку','Зависит от списка гостей','14 сентября','Мария','Заблокировано','gray'],['Утвердить тайминг','За 3 дня до свадьбы','16 сентября','Мария','Запланировано','gray'],['Выбрать площадку','Завершено 12 марта','12 марта','Пара','Выполнено','green']];return projectHead('tasks')+`<div class="page-heading"><div><h2>План подготовки</h2><p class="sub">8 из 18 задач выполнено · сроки связаны с датой свадьбы</p></div><button class="btn" data-demo="Панель задачи: название, ответственный, фиксированный/относительный срок, зависимости и файлы.">+ Задача</button></div><div class="toolbar"><input class="search" placeholder="Найти задачу…" aria-label="Найти задачу" oninput="filterTasks(this.value)"><button class="btn small soft" data-demo="Список — основной вид плана.">Список</button><button class="btn small secondary" data-demo="На доске колонки соответствуют todo / doing / done / skipped.">Доска</button><button class="btn small secondary" data-page="calendar">Календарь</button><span class="grow"></span><button class="btn small secondary" data-demo="Пара может переключить личный фильтр на все задачи проекта.">Все участники ▾</button></div><section class="card table-wrap"><table class="task-table"><thead><tr><th>Задача</th><th>Срок</th><th>Ответственный</th><th>Статус</th></tr></thead><tbody>${rows.map(([name,note,date,who,status,color])=>`<tr class="task-line"><td class="name"><label><input type="checkbox" ${status==='Выполнено'?'checked':''} onchange="showToast('Флажок меняется только в макете. В продукте выполняется проверка зависимостей и версии задачи.')">${name}</label><small>${note}</small></td><td>${date}</td><td>${who}</td><td><span class="badge ${color}">${status}</span></td></tr>`).join('')}</tbody></table></section><div class="callout">Перенос даты свадьбы сначала показывает изменённые сроки. Выполненные задачи и фиксированные даты остаются на своих местах.</div>`}
function approvals(){return projectHead('approvals')+`<div class="page-heading"><div><h2>Оформление церемонии</h2><p class="sub">Версия 2 · отправлено 8 сентября · решение до 10 сентября</p></div><span class="badge">На согласовании</span></div><div class="screen-banner"><span>Согласующие: Алина и Даниил · достаточно одного решения</span><button class="link-btn" data-demo="Предыдущие варианты и решения доступны в истории конкретных ревизий.">История версий</button></div><div class="options">${[['Садовая история','85 000 ₽','Живые цветы, текстиль и монтаж. Спокойная палитра с зеленью.',''],['Тёплый вечер','72 000 ₽','Тканевая композиция, сезонные цветы, доставка и демонтаж.','warm'],['Белая церемония','96 000 ₽','Светлая флористика и арка. Все элементы перечислены в смете.','white']].map(([title,price,desc,cls],i)=>`<article class="option ${chosen===i?'selected':''}" tabindex="0" role="button" aria-pressed="${chosen===i}" onclick="choose(${i})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();choose(${i})}"><div class="swatch ${cls}" aria-label="Условная палитра варианта"><i></i><i></i><i></i></div><h3>${title}</h3><div class="price">${price}</div><p>${desc}</p><p style="margin-top:13px;color:var(--rose)">${chosen===i?'● Выбран для решения':'○ Выбрать вариант'}</p></article>`).join('')}</div><section class="card approval-footer"><div><h3 id="choice-label">Выбран вариант «${['Садовая история','Тёплый вечер','Белая церемония'][chosen]}»</h3><small>Утверждение фиксирует решение. Выплата этим действием не создаётся.</small></div><div class="row"><button class="btn secondary" data-demo="Запрос изменений содержит обязательный комментарий и относится к версии 2.">Нужны изменения</button><button class="btn" data-demo="Пример решения по версии 2. В макете ничего не отправляется и не сохраняется.">Утвердить вариант</button></div></section><section class="card pad" style="margin-top:18px"><h3>Обсуждение</h3><div class="item"><span class="avatar">М</span><div class="text"><strong>Мария, организатор</strong><small>Добавила состав каждого варианта. После выбора отдельно применим согласованную сумму к смете.</small></div></div></section>`}
function tableSvg(cx,cy,name,count,total){let seats='';for(let i=0;i<total;i++){let a=2*Math.PI*i/total-Math.PI/2;seats+=`<circle class="seat ${i<count?'occupied':''}" cx="${cx+72*Math.cos(a)}" cy="${cy+72*Math.sin(a)}" r="6"/>`};return `<g class="plan-table" tabindex="0" role="button" aria-label="${name}, ${count} из ${total} мест" onclick="selectTable('${name}',${count},${total})" onkeydown="if(event.key==='Enter')selectTable('${name}',${count},${total})"><circle class="table-shape" cx="${cx}" cy="${cy}" r="56"/>${seats}<text class="table-label" x="${cx}" y="${cy-3}">${name}</text><text class="table-count" x="${cx}" y="${cy+17}">${count} из ${total}</text></g>`}
function seating(){return projectHead('seating')+`<div class="page-heading"><div><h2>Рассадка</h2><p class="sub">30 из 32 подтвердивших гостей · основной зал</p></div></div><div class="toolbar"><button class="btn" data-demo="Новый стол: название, форма, размеры и вместимость. В продукте сохраняется в плане.">+ Добавить стол</button><button class="btn secondary" data-demo="Зоны обозначают сцену, танцпол, вход и проходы.">◇ Добавить зону</button><span class="grow"></span><button class="btn secondary" data-demo="В продукте открывается печатный план A4/A3 и список Гость → стол/место.">▤ Печать</button></div><div class="seating-layout"><section class="plan-canvas" aria-label="Схема рассадки"><svg viewBox="0 0 790 510"><rect class="zone" x="46" y="34" width="120" height="90" rx="6"/><text class="table-count" x="106" y="82">Фотозона</text><rect class="table-shape" x="310" y="39" width="173" height="61" rx="8"/><text class="table-label" x="396" y="65">Стол пары</text><text class="table-count" x="396" y="83">Алина и Даниил</text>${tableSvg(130,242,'Стол 1',8,8)}${tableSvg(305,242,'Стол 2',8,8)}${tableSvg(480,242,'Стол 3',8,8)}${tableSvg(655,242,'Стол 4',6,8)}<rect class="zone" x="296" y="378" width="195" height="100" rx="6"/><text class="table-count" x="393" y="431">Танцпол</text><text class="table-count" x="80" y="461">Вход ↑</text></svg></section><aside class="card pad" style="align-self:start"><h3>Нерассаженные · 2</h3><p class="sub">Выберите гостя и укажите стол</p><div class="chip"><span>Нина Орлова</span><button class="link-btn" data-demo="Выбор стола и места работает без перетаскивания. В макете назначение не записывается.">Посадить</button></div><div class="chip"><span>Артём Соловьёв</span><button class="link-btn" data-demo="После назначения гость исчезнет из нерассаженных и появится у выбранного стола.">Посадить</button></div><div class="properties" id="table-properties"><h3>Свойства стола</h3><p>Нажмите на стол на схеме, чтобы увидеть вместимость и доступные действия.</p></div></aside></div><p class="prototype-note">Схема интерактивна для выбора столов. В рабочей версии изменение мест проходит через те же записи гостей и проверку одновременного назначения.</p>`}
function calendar(){let cells='';for(let n=1;n<=35;n++){const d=n-1;cells+=`<div class="day ${d===8?'current':''}"><span>${d>=1&&d<=30?d:''}</span>${d===9?'<div class="event team">15:00 · Встреча на площадке</div>':''}${d===10?'<div class="event money">Декор · 45 000 ₽</div><div class="event">Согласовать концепцию</div>':''}${d===12?'<div class="event">Срок ответов гостей</div>':''}${d===16?'<div class="event team">18:00 · Проверка тайминга</div>':''}${d===19?'<div class="event">♡ Алина и Даниил<br>День свадьбы</div>':''}</div>`}return `<div class="page-heading"><div><p class="eyebrow">Календарь агентства</p><h1>Сентябрь 2026</h1><p class="sub">Встречи, задачи и выплаты · Москва, UTC+3</p></div><button class="btn" data-demo="Создание встречи: начало, конец, часовой пояс, участники и проверка пересечений.">+ Встреча</button></div><div class="toolbar"><button class="btn small soft">Месяц</button><button class="btn small secondary" data-demo="Недельный вид показывает конкретные интервалы занятости сотрудников.">Неделя</button><button class="btn small secondary" data-demo="На телефоне основным видом будет повестка с событиями по дням.">Повестка</button><span class="grow"></span><button class="btn small secondary" data-demo="Фильтр ограничивает только разрешённые проекты.">Все свадьбы ▾</button><button class="btn small secondary" data-demo="Фильтр ответственных не расширяет права доступа к их проектам.">Вся команда ▾</button></div><div class="card table-wrap"><div class="calendar">${['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'].map(x=>`<div class="weekday">${x}</div>`).join('')}${cells}</div></div><div class="prototype-note">Макет показывает месяц. Реальные события читаются из задач, обязательств, тайминга и встреч; копий финансовых записей в календаре нет.</div>`}
function guest(){return `<div class="screen-banner"><span>Предпросмотр гостевой страницы · в продукте открывается без меню агентства</span><button class="link-btn" data-page="overview">Вернуться в проект</button></div><div class="guest-outer"><section class="guest-hero"><span class="rings" aria-hidden="true"></span><p class="eyebrow">Мы будем рады разделить этот день с вами</p><h1>Алина &amp; Даниил</h1><p class="sub">19 сентября 2026<br>Усадьба «Липы»</p><button class="btn" style="margin-top:23px" onclick="document.querySelector('#rsvp').scrollIntoView({behavior:'smooth'})">Ответить на приглашение</button></section><div class="guest-program"><section class="card"><strong>15:00</strong><p>Сбор гостей<br>Сад у главного дома</p></section><section class="card"><strong>15:30</strong><p>Церемония<br>Встречаемся у арки</p></section><section class="card"><strong>17:00</strong><p>Ужин и праздник<br>Основной зал</p></section></div><section class="card pad"><h2>Цвета нашего дня</h2><p class="sub">Будем рады спокойным светлым оттенкам. Выберите то, в чём вам удобно праздновать.</p><div class="row" style="margin-top:17px"><span style="background:#ebddd1;width:28px;height:28px;border-radius:50%"></span><span style="background:#bb8d9f;width:28px;height:28px;border-radius:50%"></span><span style="background:#98a28b;width:28px;height:28px;border-radius:50%"></span></div></section><form id="rsvp" class="card rsvp" onsubmit="event.preventDefault();document.querySelector('#rsvp-result').textContent='Пример: ваш ответ сохранён. Это демонстрация, данные никуда не отправлены.'"><p class="eyebrow">Персональное приглашение</p><h2>Нина, вы будете с нами?</h2><p class="sub">Пожалуйста, ответьте до 12 сентября. Ответ можно будет изменить.</p><div class="radio-row"><label><input required type="radio" name="attending" value="yes">Приду</label><label><input type="radio" name="attending" value="no">Не смогу</label><label><input type="radio" name="attending" value="maybe">Пока не знаю</label></div><div class="form-grid"><label class="field">Питание<select><option>Без предпочтений</option><option>Вегетарианское меню</option><option>Укажу в комментарии</option></select></label><label class="field">Нужен трансфер?<select><option>Не нужен</option><option>Нужен</option><option>Пока не знаю</option></select></label><label class="field full">Аллергии и пожелания<input placeholder="Можно оставить пустым"></label></div><button class="btn" type="submit">Отправить ответ</button><p id="rsvp-result" class="sub" role="status"></p><p class="prototype-note">Это форма макета. Настоящий гостевой доступ выдаётся только на конкретных приглашённых людей.</p></form></div>`}
function publicPage(){return `<div class="screen-banner"><span>Предпросмотр публичной главной · тексты и фотографии заполняет агентство</span><span>Демонстрация</span></div><div class="row guest-nav" style="justify-content:space-between"><div class="brand" style="padding:0">tie<span class="rings"></span></div><div class="row"><button class="link-btn" onclick="document.querySelector('#stories').scrollIntoView()">Истории</button><button class="link-btn" onclick="document.querySelector('#services').scrollIntoView()">Услуги</button><button class="link-btn" data-page="overview">Войти</button></div></div><section class="public-hero"><div><p class="eyebrow">Свадебное агентство</p><h1>Ваша история.<br>Внимание к каждой детали.</h1><p>Продумываем подготовку вместе с вами: от первых идей и выбора команды до дня, который хочется запомнить.</p><button class="btn" data-demo="CTA открывает существующую форму заявки, сохраняя выбранный кейс или услугу.">Обсудить свадьбу →</button></div><div class="art-block"><span class="rings"></span><span class="caption">Место для реальной фотографии агентства</span></div></section><div class="section-heading" id="stories"><h2>Истории наших пар</h2><span class="muted" style="font-size:11px">Структура кейсов · примеры</span></div><div class="stories">${[['Камерная свадьба в саду','Задача пары, решения агентства и фотографии результата.'],['Праздник у воды','История о выбранной площадке, команде и важных деталях.'],['Осень в усадьбе','Сценарий дня, концепция и то, как прошла подготовка.']].map(([name,desc])=>`<article class="story"><div class="photo-placeholder">Реальная фотография кейса</div><div class="story-content"><h3>${name}</h3><p>${desc}</p><button class="link-btn" data-demo="Страница кейса: факты, задача пары, решения, галерея, услуги и CTA с sourceCaseId.">Посмотреть историю →</button></div></article>`).join('')}</div><div class="section-heading" id="services"><h2>Как мы можем помочь</h2></div><div class="stories">${[['Организация свадьбы','Подготовка от брифа до координации дня.'],['Помощь с подготовкой','Подключение на выбранных этапах.'],['Координация дня','Работа команды на площадке по общему плану.']].map(([name,desc])=>`<article class="card pad"><h3>${name}</h3><p class="sub">${desc}</p><p class="sub">Состав и стоимость уточняются агентством</p><button class="link-btn" data-demo="В заявке сохраняется выбранный пакет. Публичная цена не создаёт платёж.">Обсудить этот формат →</button></article>`).join('')}</div><div class="section-heading"><h2>Перед первой встречей</h2></div><details name="agency-faq"><summary>С чего начинается подготовка?</summary><p>Здесь будет утверждённый ответ агентства: первый контакт, встреча и дальнейшие шаги.</p></details><details name="agency-faq"><summary>Как формируется бюджет?</summary><p>Здесь агентство объяснит состав услуг и порядок согласования расходов.</p></details><details name="agency-faq"><summary>Как мы будем работать в кабинете?</summary><p>У пары и организатора общее пространство с планом, согласованиями, гостями и сметой.</p></details>`}
const screens={today,overview,tasks,approvals,seating,calendar,guest,public:publicPage};
function navigate(page,replace=false){if(!screens[page]){showToast(({vendors:'Каталог и выбор подрядчиков остаются существующими разделами. Добавляются согласования вариантов и отметки брони.',finance:'Финансы: существующая смета и предстоящие выплаты, без второго журнала денег.',guests:'Гости: существующий реестр + статусы RSVP, группы приглашений и связь с рассадкой.',day:'День свадьбы: существующий тайминг пары и команды, связанные источники календаря.',more:'Ещё: сайт свадьбы, все таблицы, файлы, история, участники и офлайн.'})[page]||'Этот раздел описан в ТЗ.');return}current=page;document.querySelector('#content').innerHTML=screens[page]();document.body.classList.toggle('guest-page',page==='guest'||page==='public');document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===page||(b.dataset.page==='overview'&&['overview','tasks','approvals','seating'].includes(page))));document.querySelectorAll('.bottom-nav [data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.body.classList.remove('menu-open');document.querySelector('#menuToggle').setAttribute('aria-expanded','false');if(replace)history.replaceState(null,'','#'+page);else if(location.hash!=='#'+page)history.pushState(null,'','#'+page);window.scrollTo(0,0)}
function choose(i){chosen=i;document.querySelectorAll('.option').forEach((el,index)=>{el.classList.toggle('selected',index===i);el.setAttribute('aria-pressed',index===i);el.querySelector('p:last-child').textContent=index===i?'● Выбран для решения':'○ Выбрать вариант'});document.querySelector('#choice-label').textContent='Выбран вариант «'+['Садовая история','Тёплый вечер','Белая церемония'][i]+'»'}
function selectTable(name,count,total){document.querySelector('#table-properties').innerHTML=`<h3>${name}</h3><p>Круглый стол<br>Вместимость: ${total}<br>Занято: ${count}<br>Свободно: ${total-count}</p><button class="link-btn" data-demo="Редактор стола проверяет вместимость и связанные назначения перед сохранением.">Изменить свойства</button>`}
function filterTasks(query){document.querySelectorAll('.task-line').forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(query.toLowerCase()))}
document.addEventListener('click',e=>{const page=e.target.closest('[data-page]');if(page)navigate(page.dataset.page);const demo=e.target.closest('[data-demo]');if(demo)showToast(demo.dataset.demo)});
window.addEventListener('popstate',()=>navigate(screens[location.hash.slice(1)]?location.hash.slice(1):'today',true));
navigate(screens[location.hash.slice(1)]?location.hash.slice(1):'today',true);
</script>
